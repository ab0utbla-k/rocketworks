---
get:
  summary: Get order details
  description: |
    Retrieves the details of a specific order by its UUID.
    Returns comprehensive order information including user details,
    ordered parts, pricing, payment information, and current status.
  operationId: getOrder
  tags:
    - Orders

  parameters:
    - $ref: "../params/order_uuid.yaml"

  responses:
    "200":
      description: Order details retrieved successfully
      content:
        application/json:
          schema:
            $ref: "../components/get_order_response.yaml"
    "404":
      description: Order not found
      content:
        application/json:
          schema:
            $ref: "../components/error_response.yaml"
