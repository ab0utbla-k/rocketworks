---
post:
  summary: Cancel an order
  description: |
    Cancels an existing order by its UUID.
    The order status will be updated to CANCELLED and no further processing will occur.
    Only orders with PENDING_PAYMENT status can be cancelled.
  operationId: cancelOrder
  tags:
    - Orders

  parameters:
    - $ref: "../params/order_uuid.yaml"

  responses:
    "204":
      description: Order cancelled successfully
    "404":
      description: Order not found
      content:
        application/json:
          schema:
            $ref: "../components/error_response.yaml"
    "409":
      description: Order cannot be cancelled - already paid
      content:
        application/json:
          schema:
            $ref: "../components/error_response.yaml"
