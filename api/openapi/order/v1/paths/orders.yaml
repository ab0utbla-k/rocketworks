---
post:
  summary: Create a new order
  description: |
    Creates a new order for a user with the specified parts.
    The system will calculate the total price based on current part prices
    and return the order details with a unique order identifier.
  operationId: createOrder
  tags:
    - Orders

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/create_order_request.yaml"

  responses:
    "200":
      description: Order created successfully
      content:
        application/json:
          schema:
            $ref: "../components/create_order_response.yaml"
    "400":
      description: Invalid request - one or more parts not found
      content:
        application/json:
          schema:
            $ref: "../components/error_response.yaml"
